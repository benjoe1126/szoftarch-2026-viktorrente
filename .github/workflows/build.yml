name: Build desktop app

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: sed -i "s/packageVersion = \".*\"/packageVersion = \"${GITHUB_REF_NAME#v}\"/" desktopApp/build.gradle.kts

      - run: ./gradlew :desktopApp:packageUberJarForCurrentOS --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: viktorrente-${{ matrix.name }}
          path: src/desktopApp/build/compose/jars/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
